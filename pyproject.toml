[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-langgraph-coding-agent"
version = "0.1.0"
description = "Configurable LangGraph coding agent with parallel local-model specialists"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.0,<2",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["coding_agent*"]
